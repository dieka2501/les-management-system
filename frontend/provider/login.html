<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Admin Les</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6faf7;
        --card: #ffffff;
        --text: #17231d;
        --muted: #66746c;
        --primary: #24835d;
        --primary-dark: #176646;
        --danger: #a94442;
        --border: #d9e4dd;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(36, 131, 93, 0.14), transparent 36rem),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(23, 35, 29, 0.12);
        padding: 32px;
      }

      .brand {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #e6f3ec;
        color: var(--primary-dark);
        font-weight: 800;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        line-height: 1.05;
        margin: 0 0 10px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
        margin: 0 0 24px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        font: inherit;
        font-size: 1.1rem;
        outline: none;
        padding: 14px 16px;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(36, 131, 93, 0.12);
      }

      button {
        width: 100%;
        border: none;
        border-radius: 16px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        margin-top: 16px;
        padding: 14px 18px;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .error {
        color: var(--danger);
        min-height: 1.3em;
        margin-top: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">LB</div>
      <h1>Login Admin Les</h1>
      <p>Masukkan password untuk membuka dashboard operasional, pendaftaran, jadwal, dan pengaturan chatbot.</p>

      <form id="loginForm">
        <label for="passwordInput">
          Password
          <input id="passwordInput" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button id="submitButton" type="submit">Masuk</button>
        <div class="error" id="errorMessage" role="alert"></div>
      </form>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const passwordInput = document.getElementById("passwordInput");
      const submitButton = document.getElementById("submitButton");
      const errorMessage = document.getElementById("errorMessage");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMessage.textContent = "";
        submitButton.disabled = true;
        submitButton.textContent = "Memeriksa...";

        try {
          const response = await fetch("/api/client/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Login gagal.");
          }

          const params = new URLSearchParams(window.location.search);
          const next = safeNextPath(params.get("next") || "/");
          window.location.href = next;
        } catch (error) {
          errorMessage.textContent = error.message;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Masuk";
        }
      });

      function safeNextPath(next) {
        if (next && next.startsWith("/") && !next.startsWith("//")) {
          return next;
        }
        return "/";
      }
    </script>
  </body>
</html>
