<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Provider Chat Simulations</title>
    <link rel="stylesheet" href="/provider/assets/chat-simulations.css" />
  </head>
  <body>
    <div class="provider-shell">
      <aside class="rail" aria-label="Navigasi provider">
        <div class="brand">
          <span class="brand-mark">LB</span>
          <div>
            <strong>Provider</strong>
            <span>Chat Lab</span>
          </div>
        </div>
        <nav>
          <a class="active" href="/provider/chat-simulations">Simulasi</a>
          <a href="#trainingPanel">Dataset</a>
          <a href="#faqPanel">Knowledge Base</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Provider system</p>
            <h1>Simulasi Percakapan</h1>
          </div>
          <div class="toolbar">
            <label class="mode-picker" for="replyModeSelect">
              <span>Mode</span>
              <select id="replyModeSelect">
                <option value="rule_based">Rule-based</option>
                <option value="gemini">Gemini AI</option>
              </select>
            </label>
            <button class="secondary" id="seedButton" type="button">Seed knowledge</button>
            <button id="newSessionButton" type="button">Sesi baru</button>
            <button class="secondary" id="logoutButton" type="button">Keluar</button>
          </div>
        </header>

        <section class="layout-grid" aria-label="Simulasi percakapan provider">
          <aside class="panel sessions-panel">
            <div class="panel-head">
              <div>
                <h2>Sesi</h2>
                <p id="sessionCount">0 sesi</p>
              </div>
              <button class="icon-button" id="refreshButton" type="button" title="Refresh">R</button>
            </div>
            <div class="new-session-row">
              <input id="sessionTitleInput" type="text" value="Latihan CS Knowledge Base" aria-label="Judul sesi" />
            </div>
            <div class="session-list" id="sessionList"></div>
          </aside>

          <section class="panel chat-panel">
            <div class="panel-head chat-head">
              <div>
                <h2 id="activeSessionTitle">Belum ada sesi</h2>
                <p id="activeSessionMeta">Buat sesi untuk mulai simulasi.</p>
              </div>
              <span class="status-pill" id="stagePill">start</span>
            </div>
            <div class="chat-thread" id="chatThread"></div>
            <form class="composer" id="messageForm">
              <textarea id="messageInput" rows="2" placeholder="Tulis pesan calon orang tua..." required></textarea>
              <button type="submit">Kirim</button>
            </form>
          </section>

          <aside class="side-stack">
            <section class="panel" id="trainingPanel">
              <div class="panel-head">
                <div>
                  <h2>Training Examples</h2>
                  <p id="trainingCount">0 contoh</p>
                </div>
                <button class="secondary compact" id="copyTrainingButton" type="button">Copy JSON</button>
              </div>
              <div class="example-list" id="trainingExamples"></div>
            </section>

            <section class="panel" id="faqPanel">
              <div class="panel-head">
                <div>
                  <h2>Knowledge Base</h2>
                  <p>Respons ideal</p>
                </div>
              </div>
              <div class="faq-list" id="faqScript"></div>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/provider/assets/chat-simulations.js"></script>
  </body>
</html>
