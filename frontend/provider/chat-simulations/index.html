<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pengaturan Chatbot Les</title>
    <link rel="stylesheet" href="/client/assets/chat-simulations.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="rail" aria-label="Navigasi admin les">
        <div class="brand">
          <span class="brand-mark">LB</span>
          <div>
            <strong>Admin Les</strong>
            <span>Chatbot</span>
          </div>
        </div>
        <nav>
          <a href="/">Operasional</a>
          <a class="active" href="/client/chatbot">Latih Chatbot</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Admin Chatbot</p>
            <h1>Latih Chatbot</h1>
          </div>
          <div class="toolbar">
            <button class="secondary" id="seedButton" type="button">Muat contoh awal</button>
            <button id="newSessionButton" type="button">Latihan baru</button>
            <button class="secondary" id="logoutButton" type="button">Keluar</button>
          </div>
        </header>

        <section class="layout-grid" aria-label="Latihan percakapan chatbot">
          <aside class="panel sessions-panel">
            <div class="panel-head">
              <div>
                <h2>Sesi</h2>
                <p id="sessionCount">0 sesi</p>
              </div>
              <button class="icon-button" id="refreshButton" type="button" title="Refresh">R</button>
            </div>
            <div class="new-session-row">
              <input id="sessionTitleInput" type="text" value="Latihan jawaban chatbot" aria-label="Judul latihan" />
            </div>
            <div class="session-filters" id="sessionFilters" aria-label="Filter sesi percakapan">
              <button class="filter-button active" type="button" data-filter="all">Semua</button>
              <button class="filter-button" type="button" data-filter="whatsapp">WA</button>
              <button class="filter-button" type="button" data-filter="instagram">IG</button>
              <button class="filter-button" type="button" data-filter="provider">Latihan</button>
              <button class="filter-button" type="button" data-filter="needs_admin">Perlu admin</button>
            </div>
            <div class="session-list" id="sessionList"></div>
          </aside>

          <section class="panel chat-panel">
            <div class="panel-head chat-head">
              <div>
                <h2 id="activeSessionTitle">Belum ada sesi</h2>
                <p id="activeSessionMeta">Buat latihan untuk mulai menguji jawaban.</p>
              </div>
              <div class="chat-controls">
                <span class="status-pill" id="stagePill">Mulai</span>
                <div class="supervision-actions" id="supervisionActions"></div>
              </div>
            </div>
            <div class="chat-thread" id="chatThread"></div>
            <form class="composer" id="messageForm">
              <textarea id="messageInput" rows="2" placeholder="Tulis pesan calon orang tua..." required></textarea>
              <button id="messageSubmitButton" type="submit">Kirim</button>
            </form>
          </section>

          <aside class="side-stack">
            <section class="panel" id="trainingPanel">
              <div class="panel-head">
                <div>
                  <h2>Koreksi Jawaban</h2>
                  <p id="trainingCount">0 contoh</p>
                </div>
                <button class="secondary compact" id="copyTrainingButton" type="button">Salin JSON</button>
              </div>
              <div class="example-list" id="trainingExamples"></div>
            </section>

            <section class="panel" id="faqPanel">
              <div class="panel-head">
                <div>
                  <h2>Knowledge Base</h2>
                  <p>Contoh jawaban dasar</p>
                </div>
              </div>
              <div class="faq-list" id="faqScript"></div>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/client/assets/chat-simulations.js"></script>
  </body>
</html>
